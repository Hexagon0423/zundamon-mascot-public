[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zundamon-mascot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "Pillow>=10.0",
    "live2d-py>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mascot"]
